[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-classification"
version = "0.1.0"
description = "Reproducible training and evaluation tooling for the Kaggle brain tumor image classification dataset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Aeryes" }
]
dependencies = [
  "kaggle>=1.6.17",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "Pillow>=10.2,<12",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<0.14",
  "tomli>=2.0; python_version < '3.11'",
  "tqdm>=4.66,<5",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6.9",
  "twine>=5.1",
]

[project.scripts]
brain-tumor = "brain_tumor_classification.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ARG", "SIM", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR2004"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
packages = ["brain_tumor_classification"]
